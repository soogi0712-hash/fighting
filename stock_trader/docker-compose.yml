version: "3.9"

services:
  stock-trader:
    build: .
    container_name: stock-trader
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data        # 포지션/복리풀/봇상태 영속 저장
      - ./logs:/app/logs        # 로그 영속 저장
    environment:
      - TZ=Asia/Seoul
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
