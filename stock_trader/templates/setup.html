<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚙️ 초기 설정 | 주식 자동매매</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    color: #e0e0e0;
  }
  .card {
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px; padding: 40px; width: 560px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  h1 { font-size: 1.8rem; margin-bottom: 6px; color: #7ee8fa; }
  .subtitle { font-size: 0.85rem; color: #aaa; margin-bottom: 30px; }
  .section-title {
    font-size: 0.75rem; font-weight: 700; letter-spacing: 1.5px;
    color: #7ee8fa; text-transform: uppercase; margin: 24px 0 12px;
    padding-bottom: 6px; border-bottom: 1px solid rgba(126,232,250,0.2);
  }
  .form-row { display: flex; gap: 12px; }
  .form-group { margin-bottom: 16px; flex: 1; }
  label { display: block; font-size: 0.8rem; color: #bbb; margin-bottom: 6px; }
  input, select {
    width: 100%; padding: 10px 14px;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 8px; color: #e0e0e0; font-size: 0.9rem;
    transition: border-color .2s;
  }
  input:focus, select:focus {
    outline: none; border-color: #7ee8fa;
    background: rgba(126,232,250,0.05);
  }
  .toggle-row {
    display: flex; align-items: center; gap: 14px; margin-bottom: 16px;
  }
  .toggle-label { font-size: 0.85rem; color: #bbb; }
  .toggle { position: relative; width: 48px; height: 26px; }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; inset: 0; background: #444;
    border-radius: 26px; cursor: pointer; transition: .3s;
  }
  .slider::before {
    content: ""; position: absolute;
    width: 20px; height: 20px; left: 3px; bottom: 3px;
    background: white; border-radius: 50%; transition: .3s;
  }
  input:checked + .slider { background: #e74c3c; }
  input:checked + .slider::before { transform: translateX(22px); }
  .warn {
    background: rgba(231,76,60,0.15); border: 1px solid rgba(231,76,60,0.3);
    border-radius: 8px; padding: 12px 16px; font-size: 0.82rem;
    color: #ff8a80; margin: 16px 0;
  }
  .btn {
    width: 100%; padding: 14px; margin-top: 10px;
    background: linear-gradient(135deg, #7ee8fa, #80ff72);
    border: none; border-radius: 10px; font-size: 1rem; font-weight: 700;
    color: #1a1a2e; cursor: pointer; transition: opacity .2s, transform .1s;
  }
  .btn:hover { opacity: 0.9; transform: translateY(-1px); }
  .hint { font-size: 0.75rem; color: #888; margin-top: 4px; }
</style>
</head>
<body>
<div class="card">
  <h1>📈 자동매매 초기 설정</h1>
  <p class="subtitle">한국투자증권 KIS Open API 연동 정보를 입력하세요</p>

  <form method="POST" action="/setup">

    <!-- KIS API -->
    <div class="section-title">🔑 KIS Open API 인증</div>
    <div class="form-group">
      <label>App Key</label>
      <input name="app_key" type="text" placeholder="KIS Developer에서 발급한 App Key" required>
    </div>
    <div class="form-group">
      <label>App Secret</label>
      <input name="app_secret" type="password" placeholder="App Secret Key" required>
    </div>
    <div class="form-group">
      <label>계좌번호</label>
      <input name="account_no" type="text" placeholder="12345678-01 (계좌번호-상품코드)" required>
      <p class="hint">💡 모의투자 계좌를 먼저 테스트하세요</p>
    </div>

    <!-- 투자 모드 -->
    <div class="section-title">⚠️ 투자 모드</div>
    <div class="toggle-row">
      <label class="toggle">
        <input type="checkbox" name="is_real" value="true" id="real_toggle">
        <span class="slider"></span>
      </label>
      <span class="toggle-label" id="mode_text">📊 모의투자 모드</span>
    </div>
    <div class="warn" id="real_warn" style="display:none">
      ⚠️ <b>실전투자 모드</b>: 실제 자금으로 매매가 실행됩니다.<br>
      반드시 소액으로 충분히 테스트 후 사용하세요!
    </div>

    <!-- 리스크 설정 -->
    <div class="section-title">💰 리스크 관리</div>
    <div class="form-row">
      <div class="form-group">
        <label>종목당 최대 투자금 (원)</label>
        <input name="max_per_stock" type="number" value="1000000" min="100000" step="100000">
      </div>
      <div class="form-group">
        <label>총 최대 투자금 (원)</label>
        <input name="max_total" type="number" value="5000000" min="100000" step="100000">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>손절 기준 (%)</label>
        <input name="stop_loss" type="number" value="3.0" min="0.5" max="20" step="0.5">
      </div>
      <div class="form-group">
        <label>익절 기준 (%)</label>
        <input name="take_profit" type="number" value="5.0" min="1" max="30" step="0.5">
      </div>
    </div>

    <!-- 텔레그램 (선택) -->
    <div class="section-title">📱 텔레그램 알림 (선택)</div>
    <div class="form-group">
      <label>Bot Token</label>
      <input name="tg_token" type="text" placeholder="1234567890:ABC...">
    </div>
    <div class="form-group">
      <label>Chat ID</label>
      <input name="tg_chat_id" type="text" placeholder="-100...">
    </div>

    <button class="btn" type="submit">🚀 설정 완료 &amp; 시작</button>
  </form>
</div>

<script>
  const toggle = document.getElementById('real_toggle');
  const warn   = document.getElementById('real_warn');
  const text   = document.getElementById('mode_text');
  toggle.addEventListener('change', () => {
    if (toggle.checked) {
      warn.style.display = 'block';
      text.textContent = '🔴 실전투자 모드';
    } else {
      warn.style.display = 'none';
      text.textContent = '📊 모의투자 모드';
    }
  });
</script>
</body>
</html>
